<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="alec lowry">
  <title>alec lowry — Cairn</title>
  <!-- Cairn: four stacked stones, slight tilt for organic feel -->
  <g fill="#2c5e44">
    <!-- base stone -->
    <ellipse cx="40" cy="62" rx="24" ry="6" transform="rotate(-2 40 62)"/>
    <!-- middle-lower stone -->
    <ellipse cx="40" cy="50" rx="18" ry="5.2" transform="rotate(3 40 50)"/>
    <!-- middle-upper stone -->
    <ellipse cx="40" cy="38" rx="12.5" ry="4.6" transform="rotate(-3 40 38)"/>
    <!-- crown stone -->
    <ellipse cx="40" cy="27" rx="7.5" ry="3.8" transform="rotate(4 40 27)"/>
  </g>
  <!-- Wordmark -->
  <text x="84" y="52"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="32"
        font-weight="600"
        letter-spacing="-0.6"
        fill="#1f1a12">alec lowry</text>
</svg>
