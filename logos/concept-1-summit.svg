<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="alec lowry">
  <title>alec lowry — Summit</title>
  <!-- Icon: layered mountain with subtle snow notch -->
  <g transform="translate(8,8)">
    <!-- back peak -->
    <path d="M 30 60 L 48 24 L 66 60 Z" fill="#3d6b4f"/>
    <!-- front peak -->
    <path d="M 4 60 L 26 14 L 48 60 Z" fill="#2c5e44"/>
    <!-- snow / ridge highlight on front peak -->
    <path d="M 26 14 L 32 28 L 26 32 L 20 28 Z" fill="#f6f0df"/>
  </g>
  <!-- Wordmark -->
  <text x="92" y="52"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="32"
        font-weight="600"
        letter-spacing="-0.6"
        fill="#1f1a12">alec lowry</text>
</svg>
