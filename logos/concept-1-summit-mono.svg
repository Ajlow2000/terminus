<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="alec lowry">
  <title>alec lowry — Summit (mono)</title>
  <g transform="translate(8,8)">
    <!-- back peak: outlined only, reads as the second peak behind -->
    <path d="M 30 60 L 48 24 L 66 60"
          fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linejoin="round"/>
    <!-- front peak: solid silhouette -->
    <path d="M 4 60 L 26 14 L 48 60 Z" fill="currentColor"/>
  </g>
  <text x="92" y="52"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="32"
        font-weight="600"
        letter-spacing="-0.6"
        fill="currentColor">alec lowry</text>
</svg>
